<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ink:#3a2c5a;--soft:#6f5f93;--pk:#7b4fc9;--pkd:#5c36a8;--rose:#e0629a;--gold:#f0b44c;--cream:#fffaff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{overflow-x:hidden;max-width:100%}
*{box-sizing:border-box;min-width:0}
button{touch-action:manipulation;font-family:inherit}
body{margin:0;max-width:100%;overflow-x:hidden;background:linear-gradient(165deg,#e8dcff 0,#ffe3f2 45%,#d6f0ff 100%);background-attachment:fixed;color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-weight:700;font-size:1rem;line-height:1.5;overflow-wrap:anywhere}
[hidden]{display:none!important}
.sp{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.sp i{position:absolute;font-style:normal;color:#f3b94d;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}
main{position:relative;z-index:1;width:100%;max-width:480px;margin:0 auto;padding:64px 16px 60px}
h1{font-family:"Cinzel Decorative",serif;font-weight:700;font-size:1.7rem;line-height:1.25;margin:0 0 8px;color:var(--pkd);text-align:center}
.intro{margin:0 0 14px;color:var(--soft);text-align:center;font-weight:600}
.stats{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 0 12px}
.chip{padding:5px 14px;border-radius:999px;background:var(--cream);border:3px solid var(--ink);font:800 .9rem Nunito,sans-serif;color:var(--ink)}
button.chip{cursor:pointer;box-shadow:0 3px 0 var(--ink)}
button.chip:active{transform:translateY(3px);box-shadow:none}
.bm{height:12px;margin:0 0 12px;border:3px solid var(--ink);border-radius:12px;background:#fff;overflow:hidden}
.bm i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9bc4,#e0629a);transition:width .6s}
.now{margin:0 0 16px;padding:12px 14px;border:3px solid var(--ink);border-radius:16px;background:var(--cream);text-align:center}
.cc{display:flex;align-items:center;gap:12px;width:100%;margin:0 0 12px;padding:12px;border:3px solid var(--ink);border-radius:20px;background:var(--bg-c);color:var(--ink);text-align:left;font:inherit;cursor:pointer;box-shadow:0 4px 0 var(--ac)}
.cc:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ac)}
.cc.lk0{background:#ece6f6;box-shadow:0 4px 0 #b9aed0}
.cc.rdy{animation:pl 1.8s infinite}
@keyframes pl{0%{box-shadow:0 4px 0 var(--ac),0 0 0 0 rgba(123,79,201,.5)}70%{box-shadow:0 4px 0 var(--ac),0 0 0 14px rgba(123,79,201,0)}100%{box-shadow:0 4px 0 var(--ac),0 0 0 0 rgba(123,79,201,0)}}
.ce{flex:none;width:56px;height:56px;border-radius:50%;background:#fff;border:3px solid var(--ac);display:flex;align-items:center;justify-content:center;font-size:1.8rem}
.cc.lk0 .ce{opacity:.55;filter:grayscale(.6)}
.cb{flex:1;min-width:0}
.ch1{display:block;font-size:.78rem;color:var(--soft)}
.ch2{display:block;font-size:1rem;line-height:1.3}
.ch3{display:block;font-size:.82rem;color:var(--ac);margin-top:2px}
.cc.lk0 .ch3{color:var(--soft)}
.nav{display:block;width:100%;margin-top:12px;padding:15px 12px;border:3px solid var(--ink);border-radius:16px;background:var(--pk);color:#fff;font:800 1.05rem Nunito,sans-serif;box-shadow:0 5px 0 var(--ink);cursor:pointer}
.nav:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.nav.alt{background:#fff;color:var(--ink)}
.pin2:focus-visible,.nav:focus-visible,.chip:focus-visible,.cc:focus-visible,.cbtn:focus-visible,.mus:focus-visible,.sfxb:focus-visible,.sx:focus-visible,.dlg:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
.slot{display:flex;align-items:center;justify-content:center;min-height:270px;border:4px dashed var(--ink);border-radius:20px;background:rgba(255,250,255,.8);margin-top:12px}
.stamp{width:236px;height:236px;border:6px solid var(--pk);border-radius:50%;box-shadow:inset 0 0 0 6px #fff,inset 0 0 0 9px var(--pk);background:#fff;color:var(--pk);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px;transform:rotate(-8deg)}
.stamp b{font-family:"Cinzel Decorative",serif;font-size:1.05rem;line-height:1.2}
.stamp span{display:block;font-size:1.05rem;line-height:1.3;color:var(--ink);margin:6px 0}
.stamp em{display:block;font-style:normal;font-size:.82rem}
.stamp.hit{animation:hit .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes hit{from{transform:rotate(-20deg) scale(1.8);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
.ph{margin:0;color:var(--soft);text-align:center;padding:0 20px}
.endc{margin:0 0 6px;padding:14px;border:3px solid var(--ink);border-radius:20px;background:var(--cream);text-align:center}
.endc b{display:block;font-family:"Cinzel Decorative",serif;font-size:1.15rem;color:var(--pkd);margin:2px 0 6px}
.endc small{display:block;color:var(--soft);font-weight:600}
.cf{position:fixed;z-index:70;font-size:1.7rem;pointer-events:none;animation:cf 1.5s ease-out forwards}
@keyframes cf{from{transform:translate(0,0);opacity:1}to{transform:translate(var(--dx),var(--dy));opacity:0}}
.end{margin:20px 0 0;text-align:center;font-family:"Cinzel Decorative",serif;font-size:1.05rem;line-height:1.5;color:var(--pkd)}
.end small{display:block;font-family:Nunito,sans-serif;font-size:.9rem;color:var(--soft);margin-top:6px;font-weight:600}
.mv{position:fixed;inset:0;z-index:40;background:rgba(58,44,90,.6);display:flex;overflow-y:auto;padding:max(16px,env(safe-area-inset-top)) 14px max(16px,env(safe-area-inset-bottom))}
.box{width:100%;max-width:440px;margin:auto;background:var(--cream);border:4px solid var(--ink);border-radius:22px;padding:16px}
.dd{border:3px solid var(--ink);border-radius:14px;background:#fff;text-align:center;padding:14px 12px}
.dk{margin:0;font-size:.78rem;letter-spacing:.08em;color:var(--soft)}
.dtt{margin:2px 0;font-family:"Cinzel Decorative",serif;font-size:1.25rem;line-height:1.25;color:var(--pkd)}
.dm{margin:6px 0;font-size:1.05rem}
.dm b{font-size:1.9rem}
.dq{margin:6px 0;font-weight:600;color:var(--soft)}
.dp{margin:10px 0 0;padding-top:10px;border-top:2px dashed var(--ink);font-size:.95rem}
.jl{margin:0 0 10px;text-align:left;padding:10px 12px;border:2px solid var(--ink);border-radius:12px;background:#fff}
.jl.no{background:#efe9f8;color:var(--soft)}
.jl b{display:block}
.jl span{font-weight:600;font-size:.92rem}
.jh{margin:12px 0 6px;font-family:"Cinzel Decorative",serif;font-size:.95rem;color:var(--pkd);text-align:center}
.mus,.sfxb{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));z-index:35;width:44px;height:44px;padding:0;border:3px solid var(--ink);border-radius:50%;background:#fff;font-size:1.2rem;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.mus{right:12px}.sfxb{right:64px}
.mus.on{background:#e3d5ff}
/* story */
.stg{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;background:#fff}
.scn{position:relative;flex:1;min-height:0;overflow:hidden;background:linear-gradient(var(--b1),var(--b2))}
.sx{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:12px;z-index:3;height:44px;padding:0 14px;border:3px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink);font:800 .9rem Nunito,sans-serif;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.sb{position:absolute;top:calc(64px + env(safe-area-inset-top,0px));left:12px;z-index:3;padding:3px 12px;border-radius:999px;background:rgba(255,255,255,.9);border:2px solid var(--ink);font-size:.85rem}
.sc{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:flex-end;font-size:2.6rem;opacity:.4;padding:0 6px 4px;pointer-events:none}
.sh{position:absolute;left:0;right:0;top:14%;text-align:center;font-size:2.6rem;pointer-events:none}
.por{position:absolute;bottom:18px;font-size:5.4rem;line-height:1;transition:transform .25s,opacity .25s;filter:drop-shadow(0 6px 8px rgba(58,44,90,.35))}
.por.me{left:7%}.por.lu{right:7%}
.por.dim{opacity:.5;transform:scale(.9)}.por.on{transform:scale(1.1)}
.dlg{position:relative;flex:none;background:rgba(255,250,255,.98);border-top:4px solid #cdb6f7;border-radius:26px 26px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));min-height:230px;cursor:pointer}
.dnm{display:inline-block;margin:-36px 0 6px;padding:3px 14px;border-radius:999px;background:var(--pk);color:#fff;font-weight:800;border:3px solid var(--ink)}
.dtx{font-size:1.08rem;line-height:1.6;min-height:4.8em}
.dtx.nar{font-style:italic;color:var(--soft)}
.dnx{position:absolute;right:20px;bottom:calc(10px + env(safe-area-inset-bottom,0px));font-size:1.2rem;color:var(--pk);animation:bb 1.2s ease-in-out infinite}
@keyframes bb{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
.chs{display:grid;gap:10px;margin-top:6px}
.cbtn{padding:13px 14px;border:3px solid var(--ink);border-radius:16px;background:#fff;color:var(--ink);font:800 1rem Nunito,sans-serif;text-align:left;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.cbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.bf{position:fixed;left:50%;top:38%;z-index:60;transform:translateX(-50%);padding:6px 16px;border-radius:999px;background:#fff;border:3px solid var(--rose);color:var(--rose);font-weight:800;animation:bfu 1.4s ease-out forwards;pointer-events:none}
@keyframes bfu{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-70px);opacity:0}}
@media (prefers-reduced-motion:reduce){.stamp.hit,.cc.rdy,.dnx,.sp i,.chev{animation:none}.cf,.bf{display:none}.lk{transition:opacity .3s}.lk.open{transform:none}}
/* lock */
.lk{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;text-align:center;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none;background:linear-gradient(170deg,#d9c8ff 0,#ffd9ec 55%,#cdeeff 100%);padding:max(48px,calc(env(safe-area-inset-top,0px) + 32px)) 24px max(36px,calc(env(safe-area-inset-bottom,0px) + 24px));transition:transform .55s cubic-bezier(.3,.8,.3,1),opacity .55s}
.lk.open{transform:translateY(-100%);opacity:0;pointer-events:none}
.lk:focus-visible{outline:4px solid var(--rose);outline-offset:-8px}
.lk-date{margin:0;font-weight:800}
.lk-time{margin:0;font-size:4.6rem;line-height:1.1;font-weight:800}
.lk-title{margin:26px 0 6px;font-family:"Cinzel Decorative",serif;font-size:1.8rem;color:var(--pkd)}
.lk-sub{margin:0;color:var(--soft)}
.lk-bot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:10px}
.chev{font-size:1.8rem;line-height:1;color:var(--pkd);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(4px);opacity:.5}50%{transform:translateY(-6px);opacity:1}}
.lk-go{margin:0;padding:14px 30px;border:3px solid var(--ink);border-radius:16px;background:var(--pk);color:#fff;font-weight:800;font-size:1.1rem;box-shadow:0 5px 0 var(--ink)}
.lk-hint{margin:0;font-size:.85rem;color:var(--soft)}
</style>
</head>
<body>
<div class="sp" id="sp" aria-hidden="true"></div>

</div>

function endObj(){return ENDS.filter(function(x){return x.id===S.ending})[0]||ENDS[ENDS.length-1]}
function showFin(){
var e=endObj();
$("endc").innerHTML='<small>Ending yang kamu dapat</small><b>'+esc(e.name)+'</b><small>Ending ditemukan: '+PM.ends.length+'/'+ENDS.length+' · Kedekatan 💗 '+S.bond+'</small>';
if(S.cap)showStamp(false,S.cap);
$("hm").hidden=true;$("fin").hidden=false;window.scrollTo(0,0);
}
function showStamp(anim,d){
$("sdate").textContent=d;$("stc").textContent=endObj().name;
$("ph").hidden=true;$("stamp").hidden=false;if(anim){$("stamp").classList.add("hit");burst()}
$("bye").hidden=false;$("press").hidden=true;
}
$("press").addEventListener("click",function(){
if(S.cap||!allDone())return;
S.cap=new Date().toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"});
save();sfx("fan");buzz([60,40,60,40,120]);showStamp(true,S.cap);refresh();
});
$("back").addEventListener("click",function(){$("fin").hidden=true;$("hm").hidden=false;window.scrollTo(0,0);refresh()});
$("again").addEventListener("click",function(){
modal('<div class="dd"><p class="dm"><b>🔁</b></p><p class="dq">Mulai ulang kisah hari ini dari Bab 1? Ending yang sudah kamu temukan tetap tersimpan.</p></div>',
[{t:"Ya, ulangi kisah",f:function(){
S={day:today,done:[],bond:0,F:{},tepat:0,ending:null,cap:null};F=S.F;save();
$("stamp").hidden=true;$("stamp").classList.remove("hit");$("ph").hidden=false;$("bye").hidden=true;$("press").hidden=false;
closeModal();$("fin").hidden=true;$("hm").hidden=false;window.scrollTo(0,0);refresh();
}},{t:"Batal",alt:true,f:closeModal}]);
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!$("mv").hidden)closeModal()});
refresh();
/* layar kunci & musik */
var bgm=$("bgm"),mus=$("mus"),lk=$("lk"),HK="lumina-started",wasOn=false,started=false;
try{started=!!localStorage.getItem(HK)}catch(e){}
if(S.done.length>0||S.cap)started=true;
$("lkgo").textContent=started?TEXT.contBtn:TEXT.startBtn;
var mainEl=document.querySelector("main");
mainEl.inert=true;document.body.style.overflow="hidden";
function tick(){var d=new Date();$("lkt").textContent=("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);$("lkd").textContent=d.toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long"})}
tick();var tk=setInterval(tick,10000);
var locked=true;
function unlock(){
if(!locked)return;locked=false;clearInterval(tk);
try{localStorage.setItem(HK,"1")}catch(e){}
lk.style.transform="";lk.classList.add("open");
mainEl.inert=false;document.body.style.overflow="";
var pr=bgm.play();if(pr&&pr.catch)pr.catch(function(){});
setTimeout(function(){lk.hidden=true;window.scrollTo(0,0)},650);
}
var sy=null,dy=0;
lk.addEventListener("pointerdown",function(e){sy=e.clientY;dy=0;lk.style.transition="none";try{lk.setPointerCapture(e.pointerId)}catch(x){}});
lk.addEventListener("pointermove",function(e){if(sy===null)return;dy=Math.max(0,sy-e.clientY);lk.style.transform="translateY("+(-dy)+"px)"});
lk.addEventListener("pointerup",function(){if(sy===null)return;sy=null;lk.style.transition="";if(dy>80||dy<10)unlock();else lk.style.transform=""});
lk.addEventListener("pointercancel",function(){sy=null;lk.style.transition="";lk.style.transform=""});
lk.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "||e.key==="ArrowUp"){e.preventDefault();unlock()}});
lk.focus();
function mUi(){var on=!bgm.paused;mus.classList.toggle("on",on);mus.textContent=on?"🔊":"🎵";mus.setAttribute("aria-pressed",on);mus.setAttribute("aria-label",on?"Jeda musik":"Putar musik")}
bgm.addEventListener("play",function(){mus.hidden=false;mUi()});
bgm.addEventListener("pause",mUi);
bgm.addEventListener("error",function(){mus.hidden=true});
mus.addEventListener("click",function(){if(bgm.paused){var p=bgm.play();if(p&&p.catch)p.catch(function(){})}else bgm.pause()});
document.addEventListener("visibilitychange",function(){if(document.hidden){wasOn=!bgm.paused;bgm.pause()}else if(wasOn){var p=bgm.play();if(p&&p.catch)p.catch(function(){})}});
</script>
</body>
</html>
